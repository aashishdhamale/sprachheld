<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artikeltrainer</title>
<style>
/* ── Tokens: light on bare :root, dark via media + explicit stamp ───────── */
:root {
  color-scheme: light;
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --line: #e1e4ea;
  --ink: #161a20;
  --muted: #5b6471;
  --dim: #8a929e;

  --der: #2460c8;
  --der-soft: #e7eefc;
  --die: #c0386c;
  --die-soft: #fbe8f0;
  --das: #17845e;
  --das-soft: #e2f4ec;

  --ok: #16875a;
  --ok-soft: #e3f5ec;
  --bad: #cf3a3d;
  --bad-soft: #fdeaea;

  --radius: 16px;
  --shadow: 0 1px 2px rgba(20, 26, 36, 0.05), 0 6px 20px rgba(20, 26, 36, 0.06);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101318;
    --surface: #181c23;
    --surface-2: #1e232c;
    --line: #2b313c;
    --ink: #eef1f5;
    --muted: #a6afbc;
    --dim: #7a8391;
    --der: #7ea9ff;
    --der-soft: #1a2439;
    --die: #f283b1;
    --die-soft: #331b27;
    --das: #5ed2a6;
    --das-soft: #12291f;
    --ok: #52c795;
    --ok-soft: #12281e;
    --bad: #ff7b7d;
    --bad-soft: #2d1719;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101318;
  --surface: #181c23;
  --surface-2: #1e232c;
  --line: #2b313c;
  --ink: #eef1f5;
  --muted: #a6afbc;
  --dim: #7a8391;
  --der: #7ea9ff;
  --der-soft: #1a2439;
  --die: #f283b1;
  --die-soft: #331b27;
  --das: #5ed2a6;
  --das-soft: #12291f;
  --ok: #52c795;
  --ok-soft: #12281e;
  --bad: #ff7b7d;
  --bad-soft: #2d1719;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--der); outline-offset: 2px; border-radius: 6px; }

.wrap {
  max-width: 580px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 48px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
.eyebrow {
  display: flex;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.eyebrow span:nth-child(1) { color: var(--der); }
.eyebrow span:nth-child(2) { color: var(--die); }
.eyebrow span:nth-child(3) { color: var(--das); }
h1 {
  margin: 4px 0 2px;
  font-size: 30px;
  line-height: 1.1;
  letter-spacing: -0.025em;
  font-weight: 800;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); }

/* ── Mastery panel ──────────────────────────────────────────────────────── */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: grid;
  gap: 10px;
}
.mastery-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.mastery-top strong { font-size: 15px; }
.mastery-top span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width 300ms ease; }
.genders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.g { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.g b { font-size: 13px; }
.g.der b { color: var(--der); }
.g.die b { color: var(--die); }
.g.das b { color: var(--das); }
.g .bar { height: 6px; }
.g.der .bar > i { background: var(--der); }
.g.die .bar > i { background: var(--die); }
.g.das .bar > i { background: var(--das); }
.g small { font-variant-numeric: tabular-nums; }

/* ── Controls ───────────────────────────────────────────────────────────── */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 99px;
  padding: 6px 13px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface-2); }
.chip:hover { color: var(--ink); }
select {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 99px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  max-width: 100%;
}
.toggle { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }

/* ── Card ───────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 22px 18px 20px;
  display: grid;
  gap: 18px;
}
.card-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.topic { font-weight: 600; }
.progress { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ink); opacity: 0.55; transition: width 250ms ease; }

.word-zone { text-align: center; display: grid; gap: 6px; padding-block: 18px 6px; }
.word-line {
  display: flex;
  justify-content: center;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0.28em;
  font-size: clamp(34px, 9vw, 52px);
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.1;
  overflow-wrap: anywhere;
}
.slot {
  display: inline-block;
  min-width: 2.3em;
  border-bottom: 3px dashed var(--line);
  color: transparent;
  text-align: center;
  transition: color 150ms;
}
.slot.der { color: var(--der); border-bottom-color: transparent; }
.slot.die { color: var(--die); border-bottom-color: transparent; }
.slot.das { color: var(--das); border-bottom-color: transparent; }
.meaning { color: var(--muted); font-size: 20px; font-weight: 500; }
.meaning[hidden] { display: none; }

.speak {
  justify-self: center;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 13px;
  color: var(--muted);
}
.speak:hover { color: var(--ink); }

.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.art {
  border: 2px solid transparent;
  border-radius: 14px;
  padding: 16px 6px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.01em;
  display: grid;
  gap: 2px;
  justify-items: center;
  transition: transform 100ms ease, opacity 150ms, background 150ms, border-color 150ms;
}
.art small { font-size: 11px; font-weight: 600; opacity: 0.7; letter-spacing: 0.02em; }
.art.der { color: var(--der); background: var(--der-soft); border-color: color-mix(in srgb, var(--der) 35%, transparent); }
.art.die { color: var(--die); background: var(--die-soft); border-color: color-mix(in srgb, var(--die) 35%, transparent); }
.art.das { color: var(--das); background: var(--das-soft); border-color: color-mix(in srgb, var(--das) 35%, transparent); }
.art:hover:not(:disabled) { transform: translateY(-2px); }
.art:active:not(:disabled) { transform: translateY(0); }
.art:disabled { cursor: default; }
.art.faded { opacity: 0.35; }
.art.correct { color: #fff; }
.art.der.correct { background: var(--der); border-color: var(--der); }
.art.die.correct { background: var(--die); border-color: var(--die); }
.art.das.correct { background: var(--das); border-color: var(--das); }
:root[data-theme="dark"] .art.correct { color: #0f1216; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .art.correct { color: #0f1216; } }
.art.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); animation: shake 320ms ease; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-3px); }
}

.feedback {
  border-radius: 14px;
  padding: 12px 14px;
  display: grid;
  gap: 4px;
  font-size: 14px;
}
.feedback[hidden] { display: none; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback .verdict { font-weight: 800; font-size: 15px; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--bad); }
.feedback .detail { color: var(--muted); }
.feedback .detail b { color: var(--ink); }
.feedback .tip { color: var(--muted); font-size: 13px; }

.next {
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  background: var(--ink);
  color: var(--bg);
}
.next[hidden] { display: none; }

.session { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.session b { color: var(--ink); }
.keys { font-size: 12px; color: var(--dim); text-align: center; }
kbd {
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 0 5px;
  background: var(--surface);
  color: var(--muted);
}

/* ── End of round ───────────────────────────────────────────────────────── */
.done { text-align: center; display: grid; gap: 14px; padding-block: 8px; }
.done h2 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
.done p { margin: 0; color: var(--muted); }
.big-score { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.missed { text-align: left; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; padding: 4px; }
.missed div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.missed span:last-child { color: var(--muted); text-align: right; }
.a-der { color: var(--der); font-weight: 800; }
.a-die { color: var(--die); font-weight: 800; }
.a-das { color: var(--das); font-weight: 800; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 11px 16px;
  font-weight: 700;
}
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
.link-btn { border: none; background: none; color: var(--dim); font-size: 12px; text-decoration: underline; padding: 0; }
.link-btn.armed { color: var(--bad); font-weight: 700; }

.empty { text-align: center; color: var(--muted); padding-block: 24px; display: grid; gap: 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 420px) {
  h1 { font-size: 26px; }
  .art { font-size: 20px; padding: 14px 4px; }
  .toggle { margin-left: 0; }
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="eyebrow"><span>der</span><span>die</span><span>das</span></div>
    <h1>Artikeltrainer</h1>
    <p class="sub">600 everyday German nouns. Pick the article — words you miss come back until you get them.</p>
  </header>

  <section class="panel" aria-label="Your progress">
    <div class="mastery-top">
      <strong>Mastered</strong>
      <span id="masteryText">0 / 600</span>
    </div>
    <div class="bar"><i id="masteryBar" style="width:0%"></i></div>
    <div class="genders" id="genders"></div>
  </section>

  <div class="controls">
    <button class="chip" data-mode="all" aria-pressed="true">All words</button>
    <button class="chip" data-mode="new" aria-pressed="false">New</button>
    <button class="chip" data-mode="hard" aria-pressed="false">Difficult</button>
    <label for="topic" class="sr-only" style="position:absolute;left:-9999px">Topic</label>
    <select id="topic" aria-label="Topic"></select>
    <label class="toggle"><input type="checkbox" id="showMeaning" checked> Meaning</label>
  </div>

  <section class="card" id="card" aria-live="polite"></section>

  <div class="session" id="session"></div>
  <p class="keys"><kbd>1</kbd> der · <kbd>2</kbd> die · <kbd>3</kbd> das · <kbd>Enter</kbd> next</p>

  <footer class="footer">
    <span>Progress is saved in this browser.</span>
    <button class="link-btn" id="reset">Reset progress</button>
  </footer>
</main>

/* ── Data ───────────────────────────────────────────────────────────────── */
const WORDS = []
{
  let topic = 'Other'
  for (const raw of RAW.split('\n')) {
    const line = raw.trim()
    if (!line) continue
    if (line.startsWith('#')) { topic = line.slice(1).trim(); continue }
    const [a, w, en, pl] = line.split('|')
    WORDS.push({ a, w, en, pl: pl || '', topic })
  }
}
const TOPICS = [...new Set(WORDS.map((x) => x.topic))]
const TOTAL = WORDS.length

/* Endings that reliably give away the gender. Shown only when the rule
   agrees with the word's actual article, so it never teaches a false rule. */
const RULES = [
  [/(ung|heit|keit|schaft|ion|tät)$/, 'die', 'Nouns ending in -$1 are always feminine.'],
  [/(chen|lein)$/, 'das', 'Nouns ending in -$1 are always neuter.'],
  [/(ment|um)$/, 'das', 'Nouns ending in -$1 are usually neuter.'],
  [/(ling|ismus)$/, 'der', 'Nouns ending in -$1 are masculine.'],
  [/(tag|abend|morgen|mittag)$/i, 'der', 'Days and times of day are masculine.'],
  [/(ling|ommer|inter|erbst)$/, 'der', 'Seasons are masculine.'],
  [/e$/, 'die', 'Most nouns ending in -e are feminine (with exceptions like der Junge, das Auge).'],
]
function ruleFor(item) {
  if (/^(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)$/.test(item.w))
    return 'Days of the week are masculine.'
  for (const [re, g, text] of RULES) {
    const m = item.w.match(re)
    if (m && g === item.a) return text.replace('$1', m[1] || '')
  }
  if (/^Ge/.test(item.w) && item.a === 'das') return 'Many nouns starting with Ge- are neuter.'
  return ''
}

/* ── Storage (never throws — private windows can refuse it) ─────────────── */
const KEY = 'artikeltrainer.v1'
function loadStore() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch { return {} }
}
function saveStore() {
  try { localStorage.setItem(KEY, JSON.stringify(store)) } catch { /* not available */ }
}
const store = loadStore()
store.stats = store.stats || {}
if (store.showMeaning === undefined) store.showMeaning = true

const stat = (item) => store.stats[item.a + ' ' + item.w] || { c: 0, w: 0, s: 0 }
const isKnown = (item) => stat(item).s >= 2
const isNew = (item) => { const s = stat(item); return !s.c && !s.w }
const isHard = (item) => { const s = stat(item); return s.w > 0 && s.s < 2 }

function record(item, correct) {
  const k = item.a + ' ' + item.w
  const s = { ...stat(item) }
  if (correct) { s.c++; s.s++ } else { s.w++; s.s = 0 }
  store.stats[k] = s
  saveStore()
}

/* ── Session ────────────────────────────────────────────────────────────── */
let mode = 'all'
let topic = 'all'
let queue = []
let poolSize = 0
let cleared = new Set()
let missed = new Map()
let answered = null
let session = { attempts: 0, right: 0, streak: 0, best: 0 }

function shuffle(arr) {
  const a = arr.slice()
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1))
    ;[a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

function poolFor(m, t) {
  let pool = t === 'all' ? WORDS : WORDS.filter((x) => x.topic === t)
  if (m === 'new') pool = pool.filter(isNew)
  if (m === 'hard') pool = pool.filter(isHard)
  return pool
}

function startRound(list) {
  queue = shuffle(list)
  poolSize = queue.length
  cleared = new Set()
  missed = new Map()
  answered = null
  session = { attempts: 0, right: 0, streak: 0, best: 0 }
  render()
}

function answer(choice) {
  if (answered || !queue.length) return
  const item = queue[0]
  const correct = choice === item.a
  answered = { choice, correct }
  record(item, correct)
  session.attempts++
  if (correct) {
    session.right++
    session.streak++
    session.best = Math.max(session.best, session.streak)
  } else {
    session.streak = 0
    missed.set(item.a + ' ' + item.w, item)
  }
  render()
  document.getElementById('next')?.focus({ preventScroll: true })
}

function next() {
  if (!answered) return
  const item = queue.shift()
  if (answered.correct) {
    cleared.add(item.a + ' ' + item.w)
  } else {
    // Bring a missed word back soon — four cards later — not at the very end.
    queue.splice(Math.min(4, queue.length), 0, item)
  }
  answered = null
  render()
}

/* ── Speech ─────────────────────────────────────────────────────────────── */
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window
function germanVoice() {
  const vs = speechSynthesis.getVoices() || []
  return vs.find((v) => /^de[-_]DE/i.test(v.lang)) || vs.find((v) => /^de/i.test(v.lang)) || null
}
function say(text) {
  if (!canSpeak) return
  try {
    speechSynthesis.cancel()
    const u = new SpeechSynthesisUtterance(text)
    const v = germanVoice()
    u.lang = v?.lang || 'de-DE'
    if (v) u.voice = v
    u.rate = 0.9
    speechSynthesis.speak(u)
  } catch { /* speech unavailable */ }
}

/* ── Rendering ──────────────────────────────────────────────────────────── */
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0)

function renderMastery() {
  const known = WORDS.filter(isKnown).length
  $('masteryText').textContent = `${known} / ${TOTAL}`
  $('masteryBar').style.width = `${pct(known, TOTAL)}%`
  $('genders').innerHTML = ['der', 'die', 'das']
    .map((g) => {
      let c = 0, w = 0
      for (const item of WORDS) {
        if (item.a !== g) continue
        const s = stat(item)
        c += s.c
        w += s.w
      }
      const acc = c + w ? pct(c, c + w) : null
      return `<div class="g ${g}"><b>${g}</b>
        <div class="bar"><i style="width:${acc ?? 0}%"></i></div>
        <small>${acc == null ? 'not tried yet' : `${acc}% right`}</small></div>`
    })
    .join('')
}

function renderSession() {
  $('session').innerHTML = `
    <span><b>${session.attempts}</b> answered · <b>${session.right}</b> right${
      session.attempts ? ` · ${pct(session.right, session.attempts)}%` : ''
    }</span>
    <span>streak <b>${session.streak}</b>${session.best > 2 ? ` · best ${session.best}` : ''}</span>`
}

function renderCard() {
  const card = $('card')

  if (!poolSize) {
    card.innerHTML = `<div class="empty">
      <div>${
        mode === 'hard'
          ? 'No difficult words right now — everything you have missed you have since got right twice in a row.'
          : mode === 'new'
            ? 'You have tried every word in this selection.'
            : 'No words in this selection.'
      }</div>
      <div class="row"><button class="btn primary" data-go="all">Practise all words</button></div>
    </div>`
    return
  }

  if (!queue.length) {
    const list = [...missed.values()]
    card.innerHTML = `<div class="done">
      <h2>${list.length === 0 ? 'Alles richtig!' : list.length <= 3 ? 'Sehr gut!' : 'Geschafft!'}</h2>
      <div class="big-score">${pct(poolSize - list.length, poolSize)}%</div>
      <p>${poolSize} words · right first time: ${poolSize - list.length} · ${session.attempts} answers in total</p>
      ${
        list.length
          ? `<div class="missed">${list
              .map((x) => `<div><span><span class="a-${x.a}">${x.a}</span> ${esc(x.w)}</span><span>${esc(x.en)}</span></div>`)
              .join('')}</div>`
          : ''
      }
      <div class="row">
        ${list.length ? `<button class="btn primary" data-go="missed">Practise these ${list.length} again</button>` : ''}
        <button class="btn${list.length ? '' : ' primary'}" data-go="again">New round</button>
      </div>
    </div>`
    return
  }

  const item = queue[0]
  const done = cleared.size
  const slotClass = answered ? item.a : ''
  const plural = item.pl ? `Plural: <b>die ${esc(item.pl)}</b>` : 'Usually no plural.'
  const rule = answered ? ruleFor(item) : ''

  card.innerHTML = `
    <div class="card-top">
      <span class="topic">${esc(item.topic)}</span>
      <span>${done} / ${poolSize}${queue.length > poolSize - done ? ` · ${queue.length - (poolSize - done)} to retry` : ''}</span>
    </div>
    <div class="progress"><i style="width:${pct(done, poolSize)}%"></i></div>

    <div class="word-zone">
      <div class="word-line"><span class="slot ${slotClass}">${answered ? item.a : 'der'}</span><span>${esc(item.w)}</span></div>
      <div class="meaning" ${store.showMeaning || answered ? '' : 'hidden'}>${esc(item.en)}</div>
      ${canSpeak ? `<button class="speak" id="speak" type="button">🔊 ${answered ? 'Hear it' : 'Hear the word'}</button>` : ''}
    </div>

    <div class="answers">
      ${['der', 'die', 'das']
        .map((g, i) => {
          let cls = `art ${g}`
          if (answered) {
            if (g === item.a) cls += ' correct'
            else if (g === answered.choice) cls += ' wrong'
            else cls += ' faded'
          }
          const mark = answered ? (g === item.a ? ' ✓' : g === answered.choice ? ' ✗' : '') : ''
          return `<button class="${cls}" data-art="${g}" ${answered ? 'disabled' : ''}>${g}${mark}<small>${i + 1}</small></button>`
        })
        .join('')}
    </div>

    <div class="feedback ${answered ? (answered.correct ? 'ok' : 'bad') : ''}" ${answered ? '' : 'hidden'}>
      ${
        answered
          ? `<div class="verdict">${answered.correct ? 'Richtig!' : `Nicht ganz — it's <span class="a-${item.a}">${item.a}</span>`}</div>
             <div class="detail"><b><span class="a-${item.a}">${item.a}</span> ${esc(item.w)}</b> · ${esc(item.en)} · ${plural}</div>
             ${rule ? `<div class="tip">💡 ${esc(rule)}</div>` : ''}
             ${!answered.correct ? `<div class="tip">It comes back in a few cards.</div>` : ''}`
          : ''
      }
    </div>

    <button class="next" id="next" ${answered ? '' : 'hidden'}>Weiter →</button>`
}

function renderControls() {
  document.querySelectorAll('.chip[data-mode]').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode))
    const n = poolFor(b.dataset.mode, topic).length
    b.textContent = { all: 'All words', new: 'New', hard: 'Difficult' }[b.dataset.mode] + ` · ${n}`
  })
}

function render() {
  renderMastery()
  renderControls()
  renderCard()
  renderSession()
}

/* ── Events ─────────────────────────────────────────────────────────────── */
$('topic').innerHTML =
  `<option value="all">All topics</option>` +
  TOPICS.map((t) => `<option value="${esc(t)}">${esc(t)} · ${WORDS.filter((x) => x.topic === t).length}</option>`).join('')

$('topic').addEventListener('change', (e) => {
  topic = e.target.value
  startRound(poolFor(mode, topic))
})

document.querySelectorAll('.chip[data-mode]').forEach((b) =>
  b.addEventListener('click', () => {
    mode = b.dataset.mode
    startRound(poolFor(mode, topic))
  }),
)

$('showMeaning').checked = store.showMeaning
$('showMeaning').addEventListener('change', (e) => {
  store.showMeaning = e.target.checked
  saveStore()
  render()
})

$('card').addEventListener('click', (e) => {
  const art = e.target.closest('[data-art]')
  if (art) return answer(art.dataset.art)
  if (e.target.closest('#next')) return next()
  if (e.target.closest('#speak')) {
    const item = queue[0]
    if (item) say(answered ? `${item.a} ${item.w}` : item.w)
    return
  }
  const go = e.target.closest('[data-go]')
  if (go) {
    const g = go.dataset.go
    if (g === 'missed') startRound([...missed.values()])
    else if (g === 'all') { mode = 'all'; topic = 'all'; $('topic').value = 'all'; startRound(poolFor(mode, topic)) }
    else startRound(poolFor(mode, topic))
  }
})

document.addEventListener('keydown', (e) => {
  // The target can be the document itself (nothing focused), which has no .closest.
  if (e.target instanceof Element && e.target.closest('select, input')) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (!answered && ['1', '2', '3'].includes(e.key)) {
    e.preventDefault()
    answer(['der', 'die', 'das'][Number(e.key) - 1])
  } else if (answered && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight')) {
    e.preventDefault()
    next()
  }
})

// Reset asks for a second tap on the same button — no dialogs.
let resetArmed = null
$('reset').addEventListener('click', () => {
  const btn = $('reset')
  if (!resetArmed) {
    btn.textContent = 'Tap again to delete all progress'
    btn.classList.add('armed')
    resetArmed = setTimeout(() => {
      btn.textContent = 'Reset progress'
      btn.classList.remove('armed')
      resetArmed = null
    }, 4000)
    return
  }
  clearTimeout(resetArmed)
  resetArmed = null
  btn.textContent = 'Reset progress'
  btn.classList.remove('armed')
  store.stats = {}
  saveStore()
  startRound(poolFor(mode, topic))
})

if (canSpeak) speechSynthesis.getVoices()

startRound(poolFor(mode, topic))
</script>
</body>
</html>
